version: '3.8'

services:

  appdev:
    image: python:3.14.5
    restart: always
    tty: true
    stdin_open: true
    command: bash
    ports:
      - 8000:8000
    networks:
      - app-network
    depends_on:
      - redis
      - mongo
    volumes:
      - /home/develop/workspace/fly-python:/app:rw
    environment:
      - TZ=Asia/Shanghai

  redis:
    image: redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /home/develop/data/redis:/data:rw
    ports:
      - 6379:6379
    networks:
      - app-network

  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    networks:
      - app-network
    volumes:
      - /home/develop/data/mongodb/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: qwerASDF1234

  mongo-express:
    image: mongo-express
    restart: always
    networks:
      - app-network
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerASDF1234
      ME_CONFIG_MONGODB_URL: mongodb://root:qwerASDF1234@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

networks:
  app-network:
    name: app_network
    attachable: true