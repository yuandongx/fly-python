version: '3.8'
networks:
  app-network:
    name: app_network
    external: true

services:

  # server:
  #   image: dong01/fly-go:v0.0.8
  #   command: [ "server"]
  #   depends_on:
  #     - mongo
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - FLY_CONFIG=/app/config.yaml
  #   volumes:
  #     - /home/develop/data/worker:/app:rw
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - app-network
 

  redis:
    image: redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /home/develop/data/redis:/data:rw
    ports:
      - 6379:6379
    networks:
      - app-network

  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    networks:
      - app-network
    volumes:
      - /home/develop/data/mongodb/db:/data/db
    networks:
      - app-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    networks:
      - app-network
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

networks:
  app-network:
    name: app_network
    attachable: true